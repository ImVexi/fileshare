<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fileshare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
    .container { max-width: 680px; margin: 0 auto; padding: 2rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.8rem; color: #f0f6fc; }
    header p { color: #8b949e; margin-top: 0.3rem; }
    .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 2rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f0f6fc; }
    .drop-zone { border: 2px dashed #30363d; border-radius: 10px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #58a6ff; background: rgba(88,166,255,0.05); }
    .drop-zone-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .drop-zone-text { font-size: 1rem; color: #8b949e; }
    .drop-zone-hint { font-size: 0.8rem; color: #484f58; margin-top: 0.3rem; }
    .file-input { display: none; }
    .progress-wrap { margin-top: 1rem; display: none; }
    .progress-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .progress-bar .fill { height: 100%; background: #58a6ff; width: 0%; transition: width 0.3s; border-radius: 3px; }
    .status { margin-top: 0.75rem; font-size: 0.9rem; color: #8b949e; }
    .status a { color: #58a6ff; text-decoration: none; }
    .status a:hover { text-decoration: underline; }
    .upload-item { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 0.75rem 1rem; margin-top: 0.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .upload-item .icon { font-size: 1.1rem; flex-shrink: 0; }
    .upload-item .name { flex: 1; color: #c9d1d9; font-size: 0.9rem; word-break: break-word; }
    .upload-item .size { color: #8b949e; font-size: 0.8rem; white-space: nowrap; }
    .share-link { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: #1c2333; border: 1px solid #30363d; border-radius: 6px; font-size: 0.8rem; word-break: break-all; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .share-link:hover { border-color: #58a6ff; }
    .share-link .label { color: #8b949e; flex-shrink: 0; }
    .share-link .url { color: #58a6ff; flex: 1; }
    .share-link .copy-badge { background: #238636; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; display: none; }
    .footer { text-align: center; margin-top: 2rem; font-size: 0.8rem; color: #484f58; }
    .footer a { color: #8b949e; text-decoration: none; }
    .footer a:hover { color: #c9d1d9; }
  .usage { margin-bottom: 1rem; padding: 0.75rem 1rem; background: #0d1117; border: 1px solid #21262d; border-radius: 8px; color: #8b949e; font-size: 0.85rem; }
    .limit-password { width: 100%; margin-top: 0.75rem; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 0.65rem 0.75rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Fileshare</h1>
      <p>Upload a file and get a shareable link instantly</p>
    </header>

    <div class="card">
      <h2>Upload a file</h2>
      <div class="usage" id="usageBox">Checking quota...</div>
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem;">
        <input id="nickname" placeholder="Your nickname (optional)" style="flex:1;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:.5rem .75rem;border-radius:6px;font-size:.9rem;" />
        <button onclick="saveNickname()" style="background:#238636;color:#fff;border:none;padding:.5rem .75rem;border-radius:6px;cursor:pointer;font-size:.85rem;">Save</button>
      </div>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">&#128228;</div>
        <div class="drop-zone-text">Drop a file here or click to browse</div>
        <div class="drop-zone-hint">Images/videos only &middot; 10GB per user &middot; Ctrl+V to paste</div>
      </div>
      <input class="limit-password" id="uploadPassword" placeholder="Upload password (removes limits)" autocomplete="off" />
      <input type="file" class="file-input" id="fileInput" multiple accept="image/*,video/*" />
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="card" id="uploadsCard" style="display:none;">
      <h2>Uploaded files</h2>
      <div id="uploadList"></div>
    </div>

    <div class="footer"><a href="/admin/">Admin panel</a></div>
  </div>

  <script src="/vendor/tus.min.js"></script>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const uploadList = document.getElementById('uploadList');
    const uploadsCard = document.getElementById('uploadsCard');

    let uploadQueue = [];
    let LOCAL_UPLOAD_URL = null;
    const browserId = getOrCreateBrowserId();
    const uploadPassword = document.getElementById('uploadPassword');
    refreshUsage();
    loadNickname();
    fetch('/api/local-check').then(r => r.json()).then(d => {
      if (d.local) { LOCAL_UPLOAD_URL = d.localUrl; return; }
      (d.localIPs || []).forEach(ip => {
        const url = 'http://' + ip + ':' + (location.port || 3000);
        const c = new AbortController(); setTimeout(() => c.abort(), 1500);
        fetch(url + '/api/ping', { signal: c.signal, mode: 'no-cors' }).then(() => { LOCAL_UPLOAD_URL = url; }).catch(() => {});
      });
    }).catch(() => {});

    function getOrCreateBrowserId() {
      let id = localStorage.getItem('fileshare_browser_id');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('fileshare_browser_id', id);
      }
      return id;
    }

    async function refreshUsage() {
      try {
        const res = await fetch('/api/me', { headers: { 'X-Browser-Id': browserId } });
        const data = await res.json();
        const nick = data.nickname || '';
        document.getElementById('nickname').value = nick;
        const speedStr = data.avgSpeed ? ' | Avg speed: ' + formatSize(data.avgSpeed) + '/s' : '';
        document.getElementById('usageBox').textContent = 'Used ' + formatSize(data.usedBytes || 0) + ' of ' + formatSize(data.limitBytes || 0) + ' across ' + (data.uploadedFiles || 0) + ' upload(s)' + speedStr + (data.banned ? ' — uploading disabled' : '');
      } catch {
        document.getElementById('usageBox').textContent = 'Quota info unavailable';
      }
    }

    async function loadNickname() {
      try {
        const res = await fetch('/api/me', { headers: { 'X-Browser-Id': browserId } });
        const data = await res.json();
        if (data.nickname) document.getElementById('nickname').value = data.nickname;
      } catch {}
    }

    async function saveNickname() {
      const nick = document.getElementById('nickname').value.trim();
      try {
        await fetch('/api/me/nickname', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Browser-Id': browserId }, body: JSON.stringify({ nickname: nick }) });
        refreshUsage();
      } catch {}
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) handleFiles([file]);
        }
      }
    });

    function handleFiles(files) {
      for (const file of files) uploadQueue.push(file);
      processQueue();
    }

    function addUploadItem(filename, size) {
      uploadsCard.style.display = 'block';
      const item = document.createElement('div');
      item.className = 'upload-item';
      item.innerHTML = '<span class="icon">&#8987;</span><span class="name">' + escapeHtml(filename) + '</span><span class="size">' + formatSize(size) + '</span>';
      uploadList.prepend(item);
      return item;
    }

    async function uploadTus(file, onProgress) {
      const metadata = { filename: file.name, filetype: file.type || 'application/octet-stream' };
      const startTime = Date.now();
      return new Promise((resolve, reject) => {
        const upload = new tus.Upload(file, {
          endpoint: '/api/tus',
          chunkSize: 64 * 1024 * 1024,
          retryDelays: [0, 1000, 3000, 5000],
          metadata,
          headers: {
            'X-Browser-Id': browserId,
            'X-Upload-Password': uploadPassword.value.trim()
          },
          onError: reject,
          onProgress: (sent, total) => {
            const pct = total ? sent / total * 100 : 0;
            onProgress(pct, sent, total, startTime);
          },
          onSuccess: async () => {
            const id = upload.url.split('/').pop();
            for (let i = 0; i < 30; i++) {
              const res = await fetch('/api/tus/' + encodeURIComponent(id) + '/result', { headers: { 'X-Browser-Id': browserId } });
              if (res.status === 200) return resolve(await res.json());
              await new Promise(r => setTimeout(r, 500));
            }
            resolve({ success: true, file: { id }, url: '/f/' + id });
          }
        });
        upload.findPreviousUploads().then(previous => {
          if (previous.length) upload.resumeFromPreviousUpload(previous[0]);
          upload.start();
        }).catch(reject);
      });
    }

    async function processQueue() {
      while (uploadQueue.length > 0) {
        const file = uploadQueue.shift();
        const itemEl = addUploadItem(file.name, file.size);
        progressWrap.style.display = 'block';
        status.textContent = 'Uploading ' + file.name + '...';

        try {
          let result = await uploadTus(file, (pct, sent, total, startTime) => {
            progressFill.style.width = pct + '%';
            const elapsed = (Date.now() - startTime) / 1000;
            if (elapsed > 0.5 && sent > 0) {
              const speed = formatSize(Math.round(sent / elapsed)) + '/s';
              status.textContent = 'Uploading ' + file.name + ' — ' + speed;
            }
          });

          const link = window.location.origin + result.url;
          itemEl.querySelector('.icon').textContent = '\u2713';
          status.innerHTML = 'Uploaded: <a href="' + result.url + '" target="_blank">' + escapeHtml(file.name) + '</a>';

          const linkRow = document.createElement('div');
          linkRow.className = 'share-link';
          linkRow.innerHTML = '<span class="label">Share link:</span><span class="url">' + link + '</span><span class="copy-badge" id="badge-' + result.file.id + '">Copied!</span>';
          linkRow.onclick = function() {
            navigator.clipboard.writeText(link).then(() => {
              const badge = linkRow.querySelector('.copy-badge');
              badge.style.display = 'inline';
              setTimeout(() => { badge.style.display = 'none'; }, 2000);
            });
          };
          itemEl.after(linkRow);
        } catch (err) {
          itemEl.querySelector('.icon').textContent = '\u2717';
          status.textContent = 'Failed: ' + file.name;
        }
        progressFill.style.width = '0%';
          refreshUsage();
      }
      progressWrap.style.display = 'none';
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
