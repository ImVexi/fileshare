<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fileshare Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 2.5rem; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem; color: #f0f6fc; }
    .sub { text-align: center; color: #8b949e; font-size: 0.9rem; margin-bottom: 2rem; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.4rem; }
    input { width: 100%; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 0.7rem 0.75rem; border-radius: 6px; font-size: 1rem; }
    input:focus { outline: none; border-color: #58a6ff; }
    .btn { width: 100%; padding: 0.7rem; border-radius: 6px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; background: #238636; color: #fff; transition: background 0.2s; }
    .btn:hover { background: #2ea043; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #f85149; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none; }
    .spinner { display: none; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Fileshare</h1>
    <div class="sub">Admin Panel &mdash; enter password</div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autofocus onkeydown="if(event.key==='Enter')login()" />
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Login</button>
    <div class="error" id="error"></div>
    <div class="spinner" id="spinner"></div>
  </div>

  <script>
    async function login() {
      const pw = document.getElementById('password');
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('error');
      const spinner = document.getElementById('spinner');
      btn.disabled = true;
      spinner.style.display = 'block';
      err.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('fileshare_token', data.token);
          window.location.href = '/admin/';
        } else {
          err.textContent = data.error || 'Invalid password';
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'Connection error';
        err.style.display = 'block';
      }

      btn.disabled = false;
      spinner.style.display = 'none';
      pw.value = '';
      pw.focus();
    }
  </script>
</body>
</html>
